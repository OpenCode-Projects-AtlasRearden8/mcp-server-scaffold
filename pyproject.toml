[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-server-scaffold"
version = "1.0.0"
description = "A minimal Model Context Protocol (MCP) server scaffold in pure Python stdlib, for beginners building their first custom tool."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Asdale Dynamics, LLC" }]
keywords = ["mcp", "model-context-protocol", "ai", "agents", "tooling"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mcp-server-scaffold = "mcp_server.server:main"

[tool.setuptools]
packages = ["mcp_server", "mcp_server.tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
